name: Unit tests
description: Run unit tests

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 24
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Build packages
      run: pnpm run build:packages
      shell: bash

    - name: Unit tests
      run: pnpm run test:unit
      shell: bash
