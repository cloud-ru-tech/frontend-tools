name: Release

on:
  push:
    branches: [master]

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: ESLint
        uses: './.github/actions/eslint'

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Unit
        uses: './.github/actions/unit'

  licenses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Licenses
        uses: './.github/actions/licenses'

  publish:
    needs: [eslint, unit, licenses]
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Publish latest
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          git config --global user.email "robot@cloud.ru"
          git config --global user.name "cloud-ru-tech-robot"
          npm config --global set //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}
          pnpm install --frozen-lockfile
          if [[ ! $CI_LERNA_SKIP ]] ; then
            isNewVersionDetected=$(npx @cloud-ru/ft-lerna-changelog-generator@latest)
            if [[ "$isNewVersionDetected" != "false" ]] ; then
              pnpm run build:packages
              # catalog: разворачивает корневой prepack — lerna прогоняет lifecycle
              # корневого манифеста перед упаковкой пакетов, поэтому отдельных шагов
              # и выбрасываемого коммита здесь не нужно.
              pnpm exec lerna publish from-git --yes
            fi
          fi
        shell: bash
