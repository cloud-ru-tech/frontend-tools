name: Release preview
run-name: Release preview · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore lockfile mismatch (pnpm install --no-frozen-lockfile)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preview:
    concurrency:
      group: npm-publish-preview
      queue: max
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '26.13.1'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Prepare local preview versions
        id: version
        env:
          LOCKFILE_FLAG: ${{ inputs.force && '--no-frozen-lockfile' || '--frozen-lockfile' }}
        run: |
          git switch -c "preview-build-$GITHUB_RUN_ID"
          git config user.email "robot@cloud.ru"
          git config user.name "cloud-ru-tech"
          pnpm install "$LOCKFILE_FLAG"

          # Lerna requires a clean checkout even when it only creates local tags.
          if [[ "$LOCKFILE_FLAG" == "--no-frozen-lockfile" ]] && ! git diff --quiet -- pnpm-lock.yaml; then
            git commit --only -m "Refresh preview lockfile" -- pnpm-lock.yaml
          fi

          before_version=$(git rev-parse HEAD)
          pnpm exec lerna version prerelease --yes --exact --no-push --no-commit-hooks \
            --preid "preview-${GITHUB_SHA:0:7}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          if [[ "$(git rev-parse HEAD)" != "$before_version" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Нет изменённых пакетов для preview.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build preview packages
        if: steps.version.outputs.changed == 'true'
        run: pnpm run build:packages

      - name: Publish to npm with the preview tag
        if: steps.version.outputs.changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm exec lerna publish from-git --yes --dist-tag preview
          git tag --points-at HEAD --list '*@*-preview-*' --format='- `%(refname:short)`' >> "$GITHUB_STEP_SUMMARY"
