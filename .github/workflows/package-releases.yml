name: Package releases

# Создаёт GitHub Release на каждый тег пакета (`@cloud-ru/<pkg>@<version>`),
# который поставил workflow Release. Текст релиза — секция CHANGELOG.md пакета.
#
# Почему `workflow_run`, а не `push`:
# - Release пушит коммит `[ci skip] Version bump`, а `[ci skip]` в head-коммите
#   отменяет запуск по `push`;
# - при пуше больше трёх тегов разом GitHub не создаёт событие для тегов.
# Скрипт идемпотентен и сам находит теги без релиза, поэтому теги после
# неудачного Release получат релизы при следующем успешном.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      since:
        description: 'Учитывать теги, созданные не раньше этой даты (ISO 8601)'
        required: false
      max:
        description: 'Максимум релизов за запуск'
        required: false
        default: '100'
      dry_run:
        description: 'Только показать план, ничего не создавать'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: package-releases
  cancel-in-progress: false

jobs:
  releases:
    # После Release — только если пакеты опубликованы.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Create missing releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Теги до этой даты релизов не получают. Бэкфилл истории — ручным
          # запуском с `since`.
          RELEASES_SINCE: ${{ inputs.since || '2026-11-13T00:00:00Z' }}
          RELEASES_MAX: ${{ inputs.max || '100' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node .github/scripts/package-releases.mjs
